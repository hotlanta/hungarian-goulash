name: Update feeds
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:
  push: {paths: ["feeds.yml", "manual.yml", "scripts/**"]}
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install feedparser pyyaml
      - run: python scripts/fetch.py
      - name: Commit changes
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          git add docs/data/items.json
          git diff --cached --quiet || (git commit -m "Update feeds" && git push)
